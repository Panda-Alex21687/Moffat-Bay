<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reservation Lookup | Moffat Bay Marina</title>

    <!-- ========================================
         GOOGLE FONTS
    ======================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet"
    >

    <!-- ========================================
         EXTERNAL STYLESHEET
    ======================================== -->

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>


<body>

    <!-- ========================================
         HEADER / NAVIGATION
    ======================================== -->

    <header>

        <div class="nav">

            <!-- Marina Brand -->
            <a
                class="brand"
                href="reservation.html"
            >

                <span class="anchor">
                    ⚓
                </span>

                <span>

                    <span class="brand-name">
                        MOFFAT BAY
                    </span>

                    <span class="brand-sub">
                        MARINA
                    </span>

                </span>

            </a>


            <!-- Main Navigation -->
            <nav aria-label="Main navigation">

                <ul>

                    <li>
                        <a href="index.html">
                            HOME
                        </a>
                    </li>

                    <li>
                        <a href="reservation.html">
                            RESERVATION
                        </a>
                    </li>

                    <li>
                        <a href="reservation-summary.html">
                            SUMMARY
                        </a>
                    </li>

                    <li>
                        <a
                            class="active"
                            href="reservation-lookup.html"
                            aria-current="page"
                        >
                            LOOKUP
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- ========================================
         MAIN CONTENT
    ======================================== -->

    <main class="container">


        <!-- ========================================
             PAGE TITLE
        ======================================== -->

        <div class="eyebrow">
            UST-08 • RESERVATION LOOKUP
        </div>

        <h1 class="title">
            Find Your Reservation
        </h1>

        <div class="gold-line"></div>


        <!-- ========================================
             SEARCH RESERVATIONS
        ======================================== -->

        <section class="card">

            <div class="card-head">

                <div>

                    <h2>
                        Search Reservations
                    </h2>

                    <p class="small">
                        Search using a reservation ID
                        or customer email address.
                    </p>

                </div>

            </div>


            <!-- Search Fields -->
            <div
                style="
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 16px;
                "
            >


                <!-- Reservation ID -->
                <div>

                    <label
                        class="label"
                        for="rid"
                    >
                        Reservation ID
                    </label>

                    <input
                        id="rid"
                        type="text"
                        placeholder="MB-2026-00125"
                        style="
                            width: 100%;
                            padding: 12px;
                            border: 1px solid #cbd1dc;
                            border-radius: 6px;
                        "
                    >

                </div>


                <!-- Email Address -->
                <div>

                    <label
                        class="label"
                        for="email"
                    >
                        Email Address
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="customer@example.com"
                        style="
                            width: 100%;
                            padding: 12px;
                            border: 1px solid #cbd1dc;
                            border-radius: 6px;
                        "
                    >

                </div>

            </div>


            <!-- Search Button -->
            <div class="actions">

                <button
                    class="btn primary"
                    type="button"
                    onclick="search()"
                >
                    SEARCH RESERVATION
                </button>

            </div>

        </section>


        <!-- ========================================
             RESERVATION RESULT
        ======================================== -->

        <section
            class="card"
            id="result"
            style="display: none;"
        >

            <h2>
                Reservation Result
            </h2>

            <div
                id="resultBody"
                style="margin-top: 18px;"
            ></div>

        </section>


        <!-- ========================================
             RESERVATION HISTORY
        ======================================== -->

        <section class="card">

            <h2>
                Reservation History
            </h2>

            <div
                id="history"
                style="margin-top: 18px;"
            ></div>

        </section>

    </main>


    <!-- ========================================
         FOOTER
    ======================================== -->

    <footer>
        Moffat Bay Marina • CSD 460 Module 2 Prototype
    </footer>


    <!-- ========================================
         EXTERNAL JAVASCRIPT
    ======================================== -->

    <script src="prototype.js"></script>


    <!-- ========================================
         RESERVATION LOOKUP JAVASCRIPT
    ======================================== -->

    <script>

        /*
         * Creates the HTML used to display
         * reservation information.
         */
        function resultHTML(reservation) {

            return (
                '<div class="grid">' +

                    '<div class="item">' +
                        '<span class="label">' +
                            'Reservation ID' +
                        '</span>' +

                        '<span class="value">' +
                            reservation.id +
                        '</span>' +
                    '</div>' +


                    '<div class="item">' +
                        '<span class="label">' +
                            'Boat Name' +
                        '</span>' +

                        '<span class="value">' +
                            reservation.boatName +
                        '</span>' +
                    '</div>' +


                    '<div class="item">' +
                        '<span class="label">' +
                            'Boat Size' +
                        '</span>' +

                        '<span class="value">' +
                            reservation.boatLength +
                        '</span>' +
                    '</div>' +


                    '<div class="item">' +
                        '<span class="label">' +
                            'Slip Size' +
                        '</span>' +

                        '<span class="value">' +
                            reservation.slipSize +
                        '</span>' +
                    '</div>' +


                    '<div class="item">' +
                        '<span class="label">' +
                            'Slip Number' +
                        '</span>' +

                        '<span class="value">' +
                            reservation.slipNumber +
                        '</span>' +
                    '</div>' +


                    '<div class="item">' +
                        '<span class="label">' +
                            'Check-In Date' +
                        '</span>' +

                        '<span class="value">' +
                            reservation.checkIn +
                        '</span>' +
                    '</div>' +


                    '<div class="item">' +
                        '<span class="label">' +
                            'Status' +
                        '</span>' +

                        '<span class="value">' +
                            statusHTML(reservation.status) +
                        '</span>' +
                    '</div>' +

                '</div>'
            );
        }


        /*
         * Searches for a reservation using either
         * the reservation ID or customer email.
         */
        function search() {

            const reservation = getReservation();

            const reservationId =
                document
                    .getElementById("rid")
                    .value
                    .trim()
                    .toLowerCase();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();

            const resultBox =
                document.getElementById("result");

            const resultBody =
                document.getElementById("resultBody");


            /* Show the results section. */
            resultBox.style.display = "block";


            /*
             * Check whether the reservation ID
             * or email matches the prototype data.
             */
            if (
                (
                    reservationId &&
                    reservationId ===
                        reservation.id.toLowerCase()
                ) ||
                email === "customer@example.com"
            ) {

                resultBody.innerHTML =
                    resultHTML(reservation);
            }

            else {

                resultBody.innerHTML =
                    '<div class="notice warning">' +
                        'No reservation found. ' +
                        'Check the reservation ID or email address ' +
                        'and try again.' +
                    '</div>';
            }

        }


        /*
         * Displays the current reservation
         * in the reservation history section.
         */
        function history() {

            const reservation = getReservation();

            document.getElementById(
                "history"
            ).innerHTML =

                '<div class="grid">' +


                    '<div class="item">' +

                        '<span class="label">' +
                            'Reservation ID' +
                        '</span>' +

                        '<span class="value">' +
                            reservation.id +
                        '</span>' +

                    '</div>' +


                    '<div class="item">' +

                        '<span class="label">' +
                            'Check-In' +
                        '</span>' +

                        '<span class="value">' +
                            reservation.checkIn +
                        '</span>' +

                    '</div>' +


                    '<div class="item">' +

                        '<span class="label">' +
                            'Slip' +
                        '</span>' +

                        '<span class="value">' +
                            reservation.slipSize +
                            ' • ' +
                            reservation.slipNumber +
                        '</span>' +

                    '</div>' +


                    '<div class="item">' +

                        '<span class="label">' +
                            'Status' +
                        '</span>' +

                        '<span class="value">' +
                            statusHTML(reservation.status) +
                        '</span>' +

                    '</div>' +


                '</div>';
        }


        /* Display reservation history when page loads. */
        history();

    </script>

</body>

</html>
